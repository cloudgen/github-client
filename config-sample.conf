# =============================================================================
# config.conf - Single Source of Truth
# Project: gm-client
# =============================================================================

[core]
window_title = "Github (client)"
default_width = 1200
default_height = 800
project_name = "gm-client"

[ui]
show_navigation_buttons = false
show_user_agent_label = false
navigation_buttons_enabled = true

[storage]
base_path = "~/.app/github-client"
cookies_enabled = true
cookies_filename = "cookies.sqlite"
settings_filename = "settings.sqlite"

[database]
enabled = true
journal_mode = "WAL"

[webkit]
default_user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/146.0.0.0 Safari/537.36"
user_agent_persistence = true

[output]
quiet = false
json = false
debug = false

[automation]
auto_login_enabled = true
auto_follow_enabled = true
default_delay_ms = 800

[bookmarks]
enabled = true

[skills]
enabled = "translate"

[parameters]
shutdown_seconds = 0
bookmark_index = 0
